name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install "pytest>=8,<10" pyyaml
      - name: Compile Python sources
        run: |
          python -m compileall -q psyflow tests
          python -m py_compile setup.py
      - name: Check imports without PsychoPy installed
        run: python -m pytest -q tests/test_smoke.py tests/test_version.py

  unit:
    # Windows provides binary wheels for PsychoPy's native GUI dependencies.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
            .github/requirements-test.txt
      - name: Install project and full test dependencies
        run: python -m pip install -e . -r .github/requirements-test.txt
      - name: Verify PsychoPy test dependencies
        run: python -c "import numpy, pytest; from psychopy import core, gui, visual; from psyflow import StimUnit, BlockUnit, SubInfo"
      - name: Run all unit tests
        run: python -m pytest -q tests

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm ci
      - name: Lint website
        run: npm run lint
      - name: Build website
        run: npm run build
